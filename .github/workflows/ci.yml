name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Mesmo digest pinado em docker-compose.yml (ADR 0010) — atualizar os dois
    # juntos. Senhas aqui são só do Postgres efêmero do job, descartado ao fim;
    # não são segredos reais (regra do CLAUDE.md é sobre segredos de produção).
    services:
      postgres:
        image: postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_DB: pncp_ti
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: pncp_ti
      POSTGRES_ADMIN_PASSWORD: ci-postgres-password
      PNCP_TI_INGEST_PASSWORD: ci-ingest-password
      PNCP_TI_READER_PASSWORD: ci-reader-password
      PNCP_TI_WEB_PASSWORD: ci-web-password
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync

      - name: Aplicar migrações (schema, papéis, views)
        run: make migrate

      - name: Lint, format-check e testes
        run: make test

  secrets-scan:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Varredura de segredos (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vuln-scan:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Varredura de vulnerabilidades nas dependências (uv.lock)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          # Supressões pontuais e justificadas — ver docs/adr/0010.
          trivyignores: .trivyignore

      - name: Varredura de vulnerabilidades na imagem do Postgres
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          # mesmo digest pinado em docker-compose.yml — atualizar os dois juntos.
          image-ref: postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
