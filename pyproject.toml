[project]
name = "pncp-ti"
version = "0.1.0"
description = "Base de atas de registro de preços de TI vigentes (SIGA RJ, Compras.gov.br, PNCP), projeto pessoal."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Pinado em exatamente 0.4.0. Usado só como biblioteca (clientes HTTP do
    # Dados Abertos/PNCP, ADRs 0004 e 0016); não inicia o servidor do compras-mcp.
    # Fica no uv.lock com hashes contra deriva/rug-pull da árvore transitiva.
    # Atualizar só após ler o changelog e o diff (regra do CLAUDE.md).
    "compras-mcp==0.4.0",
    "alembic>=1.13,<2",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary,pool]>=3.1,<4",
    "httpx>=0.27,<1",
    # SDK oficial já presente na árvore do compras-mcp; servidor próprio apenas stdio.
    "mcp>=1.30,<2",
    "python-dotenv>=1.0,<2",
    "structlog>=24.1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "jinja2>=3.1,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "pytest-playwright>=0.10.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "rede: usa a rede externa; só roda com PNCP_TI_TESTES_REDE=1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pncp_ti"]
