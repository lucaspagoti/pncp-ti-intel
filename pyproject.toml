[project]
name = "pncp-ti"
version = "0.1.0"
description = "Base local de inteligência de contratações de TI (PNCP + MCP), projeto pessoal."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Pinado em exatamente 0.4.0 (ADR 0002). Declarado aqui — e não via `uvx
    # --from` — para entrar no uv.lock com hashes: protege a árvore de
    # dependências transitiva contra deriva/rug-pull, não só o pacote top-level.
    # Atualizar só após ler o changelog e o diff (regra do CLAUDE.md).
    "compras-mcp==0.4.0",
    "alembic>=1.13,<2",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "python-dotenv>=1.0,<2",
    "structlog>=24.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "fastmcp>=2.14,<3",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pncp_ti"]
